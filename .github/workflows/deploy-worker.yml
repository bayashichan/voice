name: Deploy Worker

# 音声保存API（Cloudflare Workers）をデプロイする。
#
# 手元にリポジトリのクローンが無くても、GitHubの画面から実行できるようにしてある。
#   Actions タブ → Deploy Worker → Run workflow
#
# 事前に必要な設定（一度だけ）:
#   1. Cloudflare で APIトークンを作る
#      My Profile → API Tokens → Create Token → テンプレート「Edit Cloudflare Workers」
#   2. GitHub に登録する
#      Settings → Secrets and variables → Actions → New repository secret
#      名前: CLOUDFLARE_API_TOKEN
#
# ADMIN_PASSWORD と GAS_WEB_APP_URL は Cloudflare 側のシークレットとして
# 管理しており、デプロイしても消えない。ここでは扱わない。
#
# フロントエンド（Vercel）はこのワークフローとは無関係。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存パッケージをインストール
        run: npm install
        working-directory: workers

      - name: 設定を検証する（デプロイはしない）
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-build
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Cloudflare にデプロイする
        run: npx wrangler deploy
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
